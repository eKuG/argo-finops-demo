# Applied with kubectl apply after install.yaml: insecure server (plain http behind the NodePort), fast reconcile for the demo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels: { app.kubernetes.io/name: argocd-cmd-params-cm, app.kubernetes.io/part-of: argocd }
data:
  server.insecure: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels: { app.kubernetes.io/name: argocd-cm, app.kubernetes.io/part-of: argocd }
data:
  timeout.reconciliation: 10s
  timeout.reconciliation.jitter: 0s
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
  labels: { app.kubernetes.io/component: server, app.kubernetes.io/name: argocd-server, app.kubernetes.io/part-of: argocd }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: argocd-server }
  ports:
    - { name: http, port: 80, targetPort: 8080, nodePort: 30080 }
    - { name: https, port: 443, targetPort: 8080 }
